<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#8B7BFF" />
  <title>綺妍-整數加減過關</title>

  <link rel="manifest" href="manifest-level.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="icons/icon-level.svg" />
  <link rel="apple-touch-icon" href="icons/icon-level-192.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="綺妍過關" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="cute.css" />
</head>
<body>
  <div id="app">

    <!-- ===== 設定畫面 ===== -->
    <section id="setup" class="screen active">
      <h1>🎮 綺妍的加減過關</h1>

      <div class="card">
        <h2>⭐ 選擇要練的關卡</h2>
        <div id="levels-select" class="levels-select"></div>
        <div id="mix-wrap" class="mix-wrap" hidden>
          <div class="mix-label">🎲 第 9 關混哪些題型</div>
          <div id="mix-select" class="mix-select"></div>
        </div>
        <div class="levels-actions">
          <button type="button" class="mini-btn" id="lvl-all">全選</button>
          <button type="button" class="mini-btn" id="lvl-none">全不選</button>
        </div>
      </div>

      <div class="card">
        <h2>🔢 第一個數字</h2>
        <div class="range-row">
          <label>最小 <input type="number" id="minA" value="1"></label>
          <label>最大 <input type="number" id="maxA" value="20"></label>
        </div>
      </div>

      <div class="card">
        <h2>🔢 第二個數字</h2>
        <div class="range-row">
          <label>最小 <input type="number" id="minB" value="1"></label>
          <label>最大 <input type="number" id="maxB" value="20"></label>
        </div>
      </div>

      <p id="setup-error" class="error"></p>
      <button id="start-btn" class="primary big">🚀 開始挑戰</button>
    </section>

    <!-- ===== 過關畫面 ===== -->
    <section id="quiz" class="screen">
      <header class="quiz-top">
        <button id="quit-btn" class="ghost">✕</button>
        <div class="progress-wrap"><div id="progress-bar"></div></div>
        <span id="progress-text">連續 0 / 30</span>
      </header>

      <div id="level-banner" class="level-banner"></div>
      <div id="review-panel" class="review-panel" hidden></div>

      <div class="question-area">
        <div id="mascot" class="mascot"></div>
        <div id="question" class="question"></div>
        <div id="answer" class="answer-box"><span class="placeholder">?</span></div>
        <div id="feedback" class="feedback"></div>
      </div>

      <div class="keypad">
        <button class="key" data-key="7">7</button>
        <button class="key" data-key="8">8</button>
        <button class="key" data-key="9">9</button>
        <button class="key" data-key="4">4</button>
        <button class="key" data-key="5">5</button>
        <button class="key" data-key="6">6</button>
        <button class="key" data-key="1">1</button>
        <button class="key" data-key="2">2</button>
        <button class="key" data-key="3">3</button>
        <button class="key sign" data-key="sign">±</button>
        <button class="key" data-key="0">0</button>
        <button class="key back" data-key="back">⌫</button>
      </div>

      <button id="submit-btn" class="primary big">確定</button>
    </section>

    <!-- ===== 結果畫面 ===== -->
    <section id="result" class="screen">
      <div id="mascot-win" class="mascot-win"></div>
      <h1 id="result-title">練習結束</h1>
      <div id="score" class="score"></div>
      <div id="score-detail" class="score-detail"></div>
      <div id="record-status" class="record-status"></div>
      <div id="wrong-list" class="wrong-list"></div>
      <button id="again-btn" class="primary big">再一次</button>
      <button id="home-btn" class="ghost big">回設定</button>
    </section>

    <footer id="app-version" class="app-version"></footer>

  </div>

  <script src="level.js"></script>
</body>
</html>
